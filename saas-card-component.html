<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Card Component</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card-bg: #ffffff;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --cta: #2563eb;
      --cta-hover: #1d4ed8;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --shadow-hover: 0 18px 40px rgba(17, 24, 39, 0.14);
      --glass-bg: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(255, 255, 255, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: linear-gradient(165deg, #f5f8ff 0%, #eef3fa 100%);
      font-family: Inter, "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
    }

    .card-grid {
      width: min(100%, 960px);
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      display: grid;
      gap: 16px;
      transition: transform 240ms ease, box-shadow 240ms ease;
      transform: translateY(0) scale(1);
      will-change: transform, box-shadow;
    }

    .card-title {
      margin: 0;
      font-size: 1.375rem;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .card-description {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 34ch;
    }

    .card-button {
      justify-self: start;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--cta);
      cursor: pointer;
      transition: background-color 200ms ease;
    }

    .card:hover,
    .card:focus-within,
    .card.is-hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-hover);
    }

    .card-button:hover,
    .card-button:focus-visible {
      background: var(--cta-hover);
    }

    .card.glass {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 16px;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card-grid" aria-label="SaaS card variants">
    <article class="card" aria-label="Default card state">
      <h2 class="card-title">Customer Insights Dashboard</h2>
      <p class="card-description">Track user behavior, monitor retention, and uncover growth opportunities with a clear, real-time analytics view.</p>
      <button class="card-button" type="button">Explore</button>
    </article>

    <article class="card glass is-hover" aria-label="Hover card state">
      <h2 class="card-title">Customer Insights Dashboard</h2>
      <p class="card-description">Same component, shown in hover state with optional glassmorphism styling for premium SaaS landing pages.</p>
      <button class="card-button" type="button">Explore</button>
    </article>
  </main>
</body>
</html>
